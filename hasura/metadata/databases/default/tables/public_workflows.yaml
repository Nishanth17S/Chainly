table:
  name: workflows
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
insert_permissions:
  - role: owner
    permission:
      check:
        _and:
          - org_id:
              _eq: X-Hasura-Org-Id
          - organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
                org_id:
                  _eq: X-Hasura-Org-Id
                role:
                  _eq: owner
      columns:
        - id
        - org_id
        - name
        - created_at
        - updated_at
  - role: editor
    permission:
      check:
        _and:
          - org_id:
              _eq: X-Hasura-Org-Id
          - organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
                org_id:
                  _eq: X-Hasura-Org-Id
                role:
                  _eq: editor
      columns:
        - id
        - org_id
        - name
        - created_at
        - updated_at
select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - org_id
        - name
        - created_at
        - updated_at
      filter:
        _and:
          - org_id:
              _eq: X-Hasura-Org-Id
          - organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
                org_id:
                  _eq: X-Hasura-Org-Id
                role:
                  _eq: owner
  - role: editor
    permission:
      columns:
        - id
        - org_id
        - name
        - created_at
        - updated_at
      filter:
        _and:
          - org_id:
              _eq: X-Hasura-Org-Id
          - organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
                org_id:
                  _eq: X-Hasura-Org-Id
                role:
                  _eq: editor
  - role: viewer
    permission:
      columns:
        - id
        - org_id
        - name
        - created_at
        - updated_at
      filter:
        _and:
          - org_id:
              _eq: X-Hasura-Org-Id
          - organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
                org_id:
                  _eq: X-Hasura-Org-Id
                role:
                  _eq: viewer
update_permissions:
  - role: owner
    permission:
      columns:
        - name
        - updated_at
      filter:
        _and:
          - org_id:
              _eq: X-Hasura-Org-Id
          - organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
                org_id:
                  _eq: X-Hasura-Org-Id
                role:
                  _eq: owner
      check: null
  - role: editor
    permission:
      columns:
        - name
        - updated_at
      filter:
        _and:
          - org_id:
              _eq: X-Hasura-Org-Id
          - organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
                org_id:
                  _eq: X-Hasura-Org-Id
                role:
                  _eq: editor
      check: null
delete_permissions:
  - role: owner
    permission:
      filter:
        _and:
          - org_id:
              _eq: X-Hasura-Org-Id
          - organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
                org_id:
                  _eq: X-Hasura-Org-Id
                role:
                  _eq: owner
  - role: editor
    permission:
      filter:
        _and:
          - org_id:
              _eq: X-Hasura-Org-Id
          - organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
                org_id:
                  _eq: X-Hasura-Org-Id
                role:
                  _eq: editor

