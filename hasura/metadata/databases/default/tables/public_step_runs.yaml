table:
  name: step_runs
  schema: public
object_relationships:
  - name: run
    using:
      foreign_key_constraint_on: run_id
  - name: step
    using:
      foreign_key_constraint_on: step_id
insert_permissions:
  - role: owner
    permission:
      check:
        run:
          workflow:
            _and:
              - org_id:
                  _eq: X-Hasura-Org-Id
              - organization:
                  members:
                    user_id:
                      _eq: X-Hasura-User-Id
                    org_id:
                      _eq: X-Hasura-Org-Id
                    role:
                      _eq: owner
      columns:
        - id
        - run_id
        - step_id
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - created_at
        - updated_at
  - role: editor
    permission:
      check:
        run:
          workflow:
            _and:
              - org_id:
                  _eq: X-Hasura-Org-Id
              - organization:
                  members:
                    user_id:
                      _eq: X-Hasura-User-Id
                    org_id:
                      _eq: X-Hasura-Org-Id
                    role:
                      _eq: editor
      columns:
        - id
        - run_id
        - step_id
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - created_at
        - updated_at
