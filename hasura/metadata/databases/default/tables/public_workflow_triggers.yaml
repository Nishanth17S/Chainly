                    _eq: X-Hasura-User-Id
                  org_id:
                    _eq: X-Hasura-Org-Id
                  role:
                    _eq: owner
  - role: editor
    permission:
      columns:
        - id
        - workflow_id
        - type
        - config
        - created_at
        - updated_at
      filter:
        workflow:
          _and:
            - org_id:
                _eq: X-Hasura-Org-Id
            - organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
                  org_id:
                    _eq: X-Hasura-Org-Id
                  role:
                    _eq: editor
  - role: viewer
    permission:
      columns:
        - id
        - workflow_id
        - type
        - config
        - created_at
        - updated_at
      filter:
        workflow:
          _and:
            - org_id:
                _eq: X-Hasura-Org-Id
            - organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
                  org_id:
                    _eq: X-Hasura-Org-Id
                  role:
                    _eq: viewer
