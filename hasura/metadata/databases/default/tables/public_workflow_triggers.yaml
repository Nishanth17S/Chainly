table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: owner
    permission:
      check:
        workflow:
          _and:
            - org_id:
                _eq: X-Hasura-Org-Id
            - organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
                  org_id:
                    _eq: X-Hasura-Org-Id
                  role:
                    _eq: owner
      columns:
        - id
        - workflow_id
        - type
        - config
        - created_at
        - updated_at
  - role: editor
    permission:
      check:
        workflow:
          _and:
            - org_id:
                _eq: X-Hasura-Org-Id
            - organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
                  org_id:
                    _eq: X-Hasura-Org-Id
                  role:
                    _eq: editor
      columns:
        - id
        - workflow_id
        - type
        - config
        - created_at
        - updated_at
select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - workflow_id
        - type
        - config
        - created_at
        - updated_at
