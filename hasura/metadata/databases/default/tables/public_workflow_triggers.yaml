    permission:
      columns:
        - type
        - config
        - updated_at
      filter:
        workflow:
          _and:
            - org_id:
                _eq: X-Hasura-Org-Id
            - organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
                  org_id:
                    _eq: X-Hasura-Org-Id
                  role:
                    _eq: owner
      check: null
  - role: editor
    permission:
      columns:
        - type
        - config
        - updated_at
      filter:
        workflow:
          _and:
            - org_id:
                _eq: X-Hasura-Org-Id
            - organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
                  org_id:
                    _eq: X-Hasura-Org-Id
                  role:
                    _eq: editor
      check: null
